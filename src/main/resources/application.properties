spring.application.name=Humanoid
# 本地运行（mvnw spring-boot:run）时读取根目录 .env；容器内通过 compose 注入环境变量
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/humanoid?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# DeepSeek (deepseek-flash = V4.1-Flash, supports images; alternative: deepseek-v4-pro)
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.options.model=deepseek-flash
# Spring AI path (text messages): thinking enabled at max effort
spring.ai.deepseek.chat.thinking.type=enabled
spring.ai.deepseek.chat.reasoning-effort=MAX

# LLBot OneBot 11 HTTP API (HTTP server must be enabled in llbot WebUI)
llbot.api-url=http://llbot:3000
llbot.api-token=

# AI reply (prompts: classpath:prompts/*.txt, UTF-8)
# Every N conversation rows, the sub AI merges a rolling summary; main AI sends
# system prompt + summary + current message only
humanoid.ai.summary-threshold=100
# Raw context messages sent to the main AI (stored in bot_context)
humanoid.ai.context-messages=100
# Only images within the newest N context rows are attached (avoids losing tools)
humanoid.ai.context-image-window-messages=8
humanoid.ai.max-images=4
humanoid.ai.max-image-bytes=10485760
# How many recent tool calls are injected into the main AI system prompt
humanoid.ai.recent-tool-calls=20
# Store base64 copies of images sent by tools (for later describeImage)
humanoid.ai.store-sent-images=true
humanoid.ai.max-stored-images=50
# Tool progress messages: notify user when tools start / advance / run long
humanoid.ai.tool-progress.enabled=true
humanoid.ai.tool-progress.min-interval-seconds=8
humanoid.ai.tool-progress.max-messages=8
humanoid.ai.tool-progress.heartbeat-seconds=25

# File tool sandbox: only files inside this directory can be read/written
humanoid.tools.file-base-dir=/app/files
humanoid.tools.max-file-bytes=262144
# Brave Search API key (optional; enables web search tool when set)
humanoid.tools.brave-api-key=
# Doubao (Volcengine) long-text TTS for the sendVoice tool
humanoid.voice.enabled=true
humanoid.voice.api-key=${VOICE_API_KEY:}
humanoid.voice.resource-id=seed-tts-2.0
humanoid.voice.speaker=zh_female_jiaochuannv_uranus_bigtts
humanoid.voice.format=mp3
humanoid.voice.sample-rate=24000
humanoid.voice.max-chars=1000
humanoid.voice.poll-interval-ms=1000
humanoid.voice.timeout-seconds=90
humanoid.voice.max-audio-bytes=10485760
# Doubao recording-file ASR (voice message -> text); falls back to LLBot voice_msg_to_text
humanoid.asr.enabled=true
humanoid.asr.api-key=${VOICE_API_KEY:}
humanoid.asr.resource-id=volc.bigasr.auc_turbo
humanoid.asr.model=bigmodel
humanoid.asr.timeout-seconds=30
humanoid.asr.max-audio-bytes=10485760
# Max size for files downloaded to bot_files/downloads (default 50MB)
humanoid.tools.max-download-bytes=52428800
# Max size for files uploaded to QQ (base64 in request, default 20MB)
humanoid.tools.max-send-file-bytes=20971520
# Max messages sent by one sendMessages tool call
humanoid.tools.max-batch-messages=20

# Shell tool (runs inside the app container; disable it if not needed)
humanoid.tools.shell.enabled=true
humanoid.tools.shell.timeout-seconds=15
humanoid.tools.shell.max-output-chars=4000

# Skills: markdown files, loaded from disk on every call (registerSkill is hot-loadable)
humanoid.tools.skills-dir=${humanoid.tools.file-base-dir}/skills
humanoid.tools.max-skill-chars=20000

# SVG rendering limits
humanoid.tools.max-svg-chars=200000

# Playwright MCP (streamable HTTP, container playground)
spring.ai.mcp.client.enabled=${MCP_ENABLED:true}
spring.ai.mcp.client.name=humanoid
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
# 不在启动时强制初始化，避免 Playwright 未就绪导致应用启动失败
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.playwright.url=http://playwright:8931
spring.ai.mcp.client.streamable-http.connections.playwright.endpoint=/mcp

# Playwright MCP 输出目录（容器内绝对路径，截图文件名必须写这里）
humanoid.tools.playwright-output-dir=/app/output
# 与容器 /app/output 共享的宿主目录在 spring-app 中的挂载点
humanoid.tools.mcp-output-dir=/app/mcp-output

# Proactive behavior: every 30 minutes the AI decides to skip / chat / browse videos
humanoid.proactive.enabled=true
humanoid.proactive.cron=0 */30 * * * *
humanoid.proactive.check-interval-minutes=25
# Empty = all whitelist users; comma separated QQ numbers to limit (useful for testing)
humanoid.proactive.user-ids=

# Reply once to unknown private users, with a cooldown to avoid spam
humanoid.whitelist.reject-cooldown-minutes=10

# Reminders created by the AI via tool, dispatched by scheduler when due
humanoid.reminder.cron=*/30 * * * * *
humanoid.reminder.max-attempts=3

# Two scheduler threads: proactive AI calls must not block reminder dispatch
spring.task.scheduling.pool.size=3

# Background task executor: advance IN_PROGRESS tasks step by step
humanoid.task.executor.enabled=true
humanoid.task.executor.cron=0 * * * * *
humanoid.task.executor.max-attempts=3
# Thinking level for native HTTP calls (images, summaries): disabled / low / high / max
humanoid.ai.thinking=max
# Max tool-calling rounds for the native HTTP path (<=0 = no limit, hard safety cap 1000)
humanoid.ai.max-tool-rounds=-1

# Spring AI tool-call limits (text path): -1 = unlimited
spring.ai.tools.limits.max-calls-per-tool-default=-1
spring.ai.tools.limits.max-total-tool-calls=-1

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
